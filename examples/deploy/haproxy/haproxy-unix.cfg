# terva web behind HAProxy — TLS front, filesystem-socket backend (no TCP port).
#
# Instead of a loopback TCP port, HAProxy connects to a unix socket the terva
# daemon serves. This keeps terva off every TCP port on the host, and the
# socket's ownership/permissions become part of the gate. It is fiddlier than
# the TCP backend (haproxy-tcp.cfg, the recommended default) — read the two
# constraints below before choosing it. Everything else (TLS, host routing, the
# WebSocket tunnel timeout, the auth model) is identical to haproxy-tcp.cfg.
#
# CONSTRAINT 1 — who may open the socket. `terva web --web-addr unix:PATH`
# creates the socket 0600 (owner only), so a HAProxy running as its own
# `haproxy` user cannot open a socket owned by your login user. Two clean fixes:
#   (a) SOCKET ACTIVATION with a group (recommended). A systemd .socket unit
#       creates the socket with SocketMode=0660 + SocketGroup=haproxy and terva
#       inherits the already-bound fd — so terva's 0600 default never applies
#       and HAProxy, running as group `haproxy`, can connect. Use a SYSTEM
#       socket at a shared path (/run/terva/…), NOT the per-user example unit's
#       /run/user/<uid>/ path: a system haproxy cannot even traverse into
#       another user's 0700 /run/user/<uid> directory. See the paired unit in
#       this directory's README, and docs/web.md "systemd socket activation".
#   (b) Run HAProxy as the same user that owns the socket.
#
# CONSTRAINT 2 — chroot. HAProxy's common `chroot /var/lib/haproxy` makes the
# backend socket path resolve INSIDE the chroot, so /run/terva/terva.sock would
# have to appear at /var/lib/haproxy/run/terva/terva.sock. Either drop `chroot`
# (done below) or expose the socket inside it (a bind mount). The TCP backend
# has neither constraint, which is why it is the default.
#
# See docs/web.md "Behind a reverse proxy", "Auth", and "Unix socket".

global
	log /dev/log local0
	user haproxy
	group haproxy
	# No `chroot` here — see CONSTRAINT 2. HAProxy runs as group `haproxy`, the
	# group the socket is created with (CONSTRAINT 1a), so the backend can open it.
	daemon

defaults
	log     global
	mode    http
	option  httplog
	option  dontlognull
	timeout connect 5s
	timeout client  50s
	timeout server  50s
	timeout tunnel  1h   # the panel's WebSocket lives for the session — see haproxy-tcp.cfg

frontend terva_https
	# Prefer pinning an overlay/tailnet address over every interface, e.g.:
	#   bind 100.x.y.z:443 ssl crt /etc/haproxy/certs/terva.pem   # tailnet only
	bind :443 ssl crt /etc/haproxy/certs/terva.pem
	mode http
	acl is_terva hdr(host) -i terva.example
	use_backend terva_backend if is_terva
	default_backend not_found

frontend terva_http
	bind :80
	mode http
	acl is_terva hdr(host) -i terva.example
	http-request redirect scheme https code 301 if is_terva
	default_backend not_found

backend terva_backend
	mode http
	option forwardfor
	http-request set-header X-Forwarded-Proto https
	# The daemon's filesystem socket (see CONSTRAINT 1 and the README pairing).
	# unix@ is HAProxy's server address form for a filesystem socket.
	server terva unix@/run/terva/terva.sock check

backend not_found
	mode http
	http-request return status 404 content-type text/plain string "Not found"
