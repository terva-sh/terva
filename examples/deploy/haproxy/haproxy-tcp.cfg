# terva web behind HAProxy — TLS front, loopback TCP backend.
#
# HAProxy terminates TLS and reverse-proxies to a terva web daemon bound on
# loopback (127.0.0.1:8730). terva enforces its own bearer token
# (--web-token-file); HAProxy forwards the Authorization header untouched. This
# is the simpler of the two backends and the recommended default — see
# haproxy-unix.cfg for the filesystem-socket variant and why it is fiddlier.
#
# Auth model: TLS plus a network boundary (bind an overlay interface, see the
# frontend) keep strangers off the port; the daemon's bearer token gates
# whoever reaches it. Anything HAProxy forwards reaches a daemon that can run
# `bash` as you, so treat the whole path as privileged. For real per-user SSO,
# front HAProxy with an identity proxy (oauth2-proxy, an Authentik outpost, or
# HAProxy SPOE) that sets a trusted header, then start the daemon with
# `--web-auth-header X-Forwarded-User` (+ `--web-trusted-proxy` if HAProxy is
# not on loopback). Plain HAProxy does not do nginx-style auth_request itself.
#
# See docs/web.md "Behind a reverse proxy" and "Auth".

global
	log /dev/log local0
	chroot /var/lib/haproxy
	user haproxy
	group haproxy
	daemon

defaults
	log     global
	mode    http
	option  httplog
	option  dontlognull
	timeout connect 5s
	timeout client  50s
	timeout server  50s
	# The panel holds ONE WebSocket open for the whole session and can go
	# minutes without a byte while the agent thinks. Without `timeout tunnel`
	# it inherits `timeout server` (50s) and the socket is cut — the panel then
	# reconnects on a fixed 50s interval, forever. terva pings every 20s, which
	# masks a 50s timeout, but set this so a long quiet turn can't outlast it.
	timeout tunnel  1h

frontend terva_https
	# Prefer pinning an overlay/tailnet address over binding every interface,
	# so the panel is never on the public internet, e.g.:
	#   bind 100.x.y.z:443 ssl crt /etc/haproxy/certs/terva.pem   # tailnet only
	bind :443 ssl crt /etc/haproxy/certs/terva.pem
	mode http
	# Route by Host so other vhosts can share this frontend; each would get its
	# own crt + acl + backend.
	acl is_terva hdr(host) -i terva.example
	use_backend terva_backend if is_terva
	default_backend not_found

frontend terva_http
	bind :80
	mode http
	# Send matching hosts to HTTPS; anything else 404s without redirecting.
	acl is_terva hdr(host) -i terva.example
	http-request redirect scheme https code 301 if is_terva
	default_backend not_found

backend terva_backend
	mode http
	option forwardfor
	http-request set-header X-Forwarded-Proto https
	# The daemon on loopback; it enforces --web-token-file, and HAProxy passes
	# the Authorization header through as-is.
	server terva 127.0.0.1:8730 check

backend not_found
	mode http
	http-request return status 404 content-type text/plain string "Not found"
