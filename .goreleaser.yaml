# GoReleaser config — PUBLIC channel. This file ships at the repo root
# of the curated `release` branch on github.com/terva-sh/terva, copied
# there by the release-cut (scripts/release.sh); it replaces the
# internal Forgejo-publishing config wholesale. Releases publish as
# GitHub Releases, triggered by the v* tag the publish flow pushes to
# the mirror. See docs/plans/release-process.md.
#
# The region between the shared-packaging markers must stay
# byte-identical with the internal .goreleaser.yaml — enforced by
# `scripts/release.sh check-overlay` in CI.

version: 2

project_name: terva

# --- shared packaging (keep byte-identical with scripts/release-overlay/.goreleaser.yaml) ---
before:
  hooks:
    - go mod tidy

builds:
  - id: terva
    main: ./cmd/terva
    binary: terva
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    # Windows/arm64 is shipped by Go but rarely used — skip to keep the
    # release artifact list tidy.
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: terva
    # Human-friendly name: terva_0.1.0_darwin_arm64.tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  # Used by `goreleaser release --snapshot`; lets contributors build
  # a local release without pushing a tag.
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  # `git` reads the local log; the github/gitea modes query the host's
  # API, which the fork's Forgejo release flow doesn't need.
  use: git
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^ci:"
      - "^test:"
  groups:
    - title: features
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: fixes
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 1
    - title: other
      order: 999

# --- end shared packaging ---

release:
  github:
    owner: terva-sh
    name: terva
  draft: false
  prerelease: auto
  # Auto-generated release notes include the changelog groups above plus
  # an install snippet so the release page itself is a landing page.
  header: |
    ## terva {{ .Tag }}

    > terva is the project formerly known as zot. Existing installs keep <!-- rename:keep -->
    > working: the self-updater bridges the rename, `ZOT_*` env vars and <!-- rename:keep -->
    > pre-rename data directories are still read (deprecation window: two <!-- rename:keep -->
    > tagged releases for env vars; data dirs forever), and `.zotsession` <!-- rename:keep -->
    > files import forever. Details: docs/fork.md.

    one-liner install:

    ```bash
    curl -fsSL https://terva.sh/install.sh | bash
    ```

    or download a binary below, `chmod +x`, and drop it on your `$PATH`.
