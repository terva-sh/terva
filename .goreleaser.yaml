# GoReleaser config — PUBLIC channel. This file ships at the repo root
# of the curated `release` branch on github.com/terva-sh/terva, copied
# there by the release-cut (scripts/release.sh); it replaces the
# internal Forgejo-publishing config wholesale. Releases publish as
# GitHub Releases, triggered by the v* tag the publish flow pushes to
# the mirror. See docs/plans/release-process.md.
#
# The region between the shared-packaging markers must stay
# byte-identical with the internal .goreleaser.yaml — enforced by
# `scripts/release.sh check-overlay` in CI.

version: 2

project_name: terva

# --- shared packaging (keep byte-identical with scripts/release-overlay/.goreleaser.yaml) ---
before:
  hooks:
    - go mod tidy

builds:
  # Two channel binaries from one source tree, differing only in build
  # tags. `terva` is the FULL build — every optional feature compiled in:
  # the ACP editor run mode (-tags terva_acp) plus the telegram connector
  # (linked by default). It is what the install one-liner pulls. `terva-min`
  # is the LEAN build (-tags terva_no_telegram): no chat connectors linked
  # and ACP left as its no-op stub. Both archives unpack the same `terva`
  # command; pick the one whose footprint you want.
  - id: terva
    main: ./cmd/terva
    binary: terva
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    # Windows/arm64 is shipped by Go but rarely used — skip to keep the
    # release artifact list tidy.
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    # Full build: compile in the ACP run mode. Telegram is in by default,
    # so no tag is needed to keep it.
    tags:
      - terva_acp
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
  - id: terva-min
    main: ./cmd/terva
    binary: terva
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    # Lean build: drop the telegram connector. ACP stays the no-tag stub.
    tags:
      - terva_no_telegram
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: terva
    ids: [terva]
    # Human-friendly name: terva_0.1.0_darwin_arm64.tar.gz (the full build).
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
    format_overrides:
      - goos: windows
        formats: [zip]
  - id: terva-min
    ids: [terva-min]
    # Lean build: terva-min_0.1.0_darwin_arm64.tar.gz
    name_template: "{{ .ProjectName }}-min_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  # Used by `goreleaser release --snapshot`; lets contributors build
  # a local release without pushing a tag.
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  # `git` reads the local log; the github/gitea modes query the host's
  # API, which the fork's Forgejo release flow doesn't need.
  use: git
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^ci:"
      - "^test:"
  groups:
    - title: features
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: fixes
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 1
    - title: other
      order: 999

# --- end shared packaging ---

release:
  github:
    owner: terva-sh
    name: terva
  draft: false
  prerelease: auto
  # Auto-generated release notes include the changelog groups above plus
  # an install snippet so the release page itself is a landing page.
  header: |
    ## terva {{ .Tag }}

    > terva is a hard fork of zot, not a <!-- rename:keep -->
    > replacement for it — zot continues upstream as its own project. terva is an <!-- rename:keep -->
    > experiment in hardening a fast-moving agent harness, and weights priorities
    > differently. Coming from zot, migration is smooth: the self-updater bridges <!-- rename:keep -->
    > the rename, `ZOT_*` env vars and pre-rename data directories are still read <!-- rename:keep -->
    > (deprecation window: two tagged releases for env vars; data dirs forever),
    > and `.zotsession` files import forever. Details: docs/fork.md. <!-- rename:keep -->

    one-liner install:

    ```bash
    curl -fsSL https://terva.sh/install.sh | bash
    ```

    or download a binary below, `chmod +x`, and drop it on your `$PATH`.
    Two builds ship: `terva_*` is the full binary (every feature compiled
    in, including the `terva acp` editor mode); `terva-min_*` is the lean
    build with the chat connectors left out. Both install the `terva` command.
